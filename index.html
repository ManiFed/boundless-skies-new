<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Boundless Skies — Accessible Wonder for All</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Boundless Skies opens the natural world — from rising constellations to grazing wildlife — to children and adults of every ability." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: "Inter", system-ui, sans-serif;
      background: #FBF4E0;
      color: #0A0E1F;
      font-size: 18px;
      line-height: 1.6;
    }
    a { color: inherit; }
    h1, h2, h3 { text-wrap: balance; }
    p { text-wrap: pretty; }
    *:focus-visible { outline: 2px solid #E8B86D; outline-offset: 3px; }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }

    /* ── Layout helpers ── */
    .container { max-width: 1280px; margin: 0 auto; }
    .section-eyebrow {
      font-family: "Inter", sans-serif;
      font-size: 12px;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      margin-bottom: 18px;
    }

    /* ── NAV ── */
    .nav {
      position: absolute;
      top: 0; left: 0; right: 0;
      z-index: 10;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      padding: 24px 56px;
    }
    .nav-links { display: flex; gap: 28px; justify-content: center; }
    .nav-link {
      color: #F5EBD3;
      text-decoration: none;
      font-size: 14px;
      letter-spacing: 0.04em;
      opacity: 0.92;
      transition: opacity 200ms;
    }
    .nav-link:hover { opacity: 1; }
    .nav-right { display: flex; gap: 24px; align-items: center; justify-self: end; }
    .nav-cta {
      background: #E8B86D;
      color: #0A0E1F;
      text-decoration: none;
      font-size: 13px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      padding: 10px 18px;
      border-radius: 2px;
      font-weight: 500;
      transition: background 200ms;
    }
    .nav-cta:hover { background: #f0c880; }

    /* ── WORDMARK ── */
    .wordmark {
      display: inline-flex;
      align-items: center;
      gap: 14px;
      color: #F5EBD3;
      text-decoration: none;
    }
    .wordmark--dark { color: #0A0E1F; }
    .wordmark img {
      width: 44px; height: 44px;
      border-radius: 50%;
      object-fit: cover;
      box-shadow: 0 0 0 1px rgba(245,235,211,0.18);
    }
    .wordmark--dark img { box-shadow: 0 0 0 1px rgba(10,14,31,0.12); }
    .wordmark-text { display: flex; flex-direction: column; line-height: 1; gap: 4px; }
    .wordmark-name {
      font-family: "Cormorant Garamond", serif;
      font-weight: 500;
      font-size: 21px;
      letter-spacing: 0.02em;
